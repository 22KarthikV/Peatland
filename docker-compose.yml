services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: peatwatch
      POSTGRES_PASSWORD: peatwatch
      POSTGRES_DB: peatwatch
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peatwatch -d peatwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:2026.10.4
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in .env}
      SERVICES: s3,sqs,secretsmanager
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if b'\"completed\": true' in urllib.request.urlopen('http://localhost:4566/_localstack/init/ready').read() else 1)"
      interval: 5s
      timeout: 5s
      retries: 20

  titiler:
    image: ghcr.io/developmentseed/titiler:0.22.0
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_ENDPOINT: localstack:4566
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.tiff
      TITILER_API_CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "8001:80"
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  postgis-data:
  localstack-data:
