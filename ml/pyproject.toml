[project]
name = "peatwatch-ml"
version = "0.0.0"
description = "PeatWatch ml package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "geopandas>=1.2.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
