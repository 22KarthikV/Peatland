[project]
name = "peatwatch-ml"
version = "0.0.0"
description = "PeatWatch ml package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "geopandas>=1.2.0",
    "joblib>=1.6.0",
    "jsonschema>=4.26.0",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
# U-Net training (M8). Not needed by the worker / inference image.
# torch / torchvision resolve from the PyTorch CPU index on every platform (small, no CUDA
# libraries); Colab uses its preinstalled CUDA torch instead (see tasks/handoffs/M8.md).
train = [
    "segmentation-models-pytorch>=0.5.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
