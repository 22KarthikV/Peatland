[project]
name = "peatwatch-ml"
version = "0.0.0"
description = "PeatWatch ml package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "geopandas>=1.2.0",
    "joblib>=1.6.0",
    "jsonschema>=4.26.0",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
