[project]
name = "peatwatch-pipeline"
version = "0.0.0"
description = "PeatWatch pipeline package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.43.123",
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pystac-client>=0.9.1",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "typer>=0.27.3",
]

[project.scripts]
peatwatch-pipeline = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
