[project]
name = "peatwatch-api"
version = "0.0.0"
description = "PeatWatch api package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "geoalchemy2>=0.20.0",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# The worker runs the real pipeline and models (api.steps); the API image does not need them.
worker = [
    "numpy>=2.5.4",
    "peatwatch-ml",
    "peatwatch-pipeline",
    "rasterio>=1.5.2",
]

[tool.uv.sources]
peatwatch-ml = { workspace = true }
peatwatch-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
